const jokes=[{"number": 1, "title": "The Monkey, the Lizard and the Crocodile", "lang": "English", "body": "A monkey is sitting in a tree, smoking a joint, when a lizard walks past. Stops and said to the monkey, hey, what are you doing? Monkey says, smoking a joint. Come join me. My cold-blooded friend. So the lizard climbs up, sits next to the monkey, and they have a joint together. After a while, the lizard says, oh my mouth's dry. He's going to go and get a drink from the river. At the riverbank, the lizard is so stoned that he leans too far over and falls in. A crocodile sees this. Swims over to the stone lizard. Helping him to the side. He then asks the lizard, what's the matter with you? The lizard explains to the crocodile that he was sitting in the tree, smoking a joint with his new friend, the monkey. He then explained how his mouth got dry and that he was so wasted that when he went to get a drink in the river, he fell in. The inquisitive crocodile says, he has to check this out. So he walks into the jungle and finds a tree where the monkey is sitting, finishing a joint. He looks up and says, hey, monkey. The monkey looks down and says, dude, how much water did you drink? \n\nTexte intégral indisponible dans la transcription fournie."}, {"number": 2, "title": "Football in Heaven", "lang": "English", "body": "Two 90-year-old men, Mike and Joe, have been friends all their lives. When it becomes clear that Joe is dying, Mike visits him every day. One day Mike says, Joe, we both love football all our lives. We played together every Saturday for years. Do me one favor, when you get to heaven, let me know if there's football there. Joe looks up from his deathbed. Mike, you've been my best friend for years. If all is possible, I'll let you know. And shortly after, Joe passes. A couple of nights later, at midnight, Mike is awakened by a blinding flash of light and a voice calling his name. Mike, Mike, Who is it? Mike asks. Who's there? Mike, it's me, Joe. You're not Joe. Joe just died. I'm telling you, it's me, Joe. Joe, where are you? in Heaven, Joe replies. Tell me the good news. well, the good news is It's a great in here. There's football, there's all our friends, we're all young, we can play for hours, it never rains or snows, but there's some bad news. Okay, well, what's the bad news? Well, you're on the team sheet for Saturday's match.\n\n\nTexte intégral indisponible dans la transcription fournie."}, {"number": 3, "title": "Der Flug nach London", "lang": "Deutsch", "body": "Drei Nonnen steigen in ein Flug nach London, die Deutsche setzt sich auf den Platz am Gang und nach dem Start zieht sie seine Schuhe aus, aus der Holländer sagt entschuldigen Sie, ich möchte mir eine Cola holen, sagt die Deutsche, bleiben Sie ruhig sitzen, ich sitz am Gang, ich hol Ihnen ihre Cola. Warum ist der Deutsche aufgestanden, nimmt der Holländer einen seiner Schuhe und spuckt hinein. Oh ja, das ist lustig, das ist lustig Aus der Deutsche zurück, um ihr ihre Kralle zurück und genießen den Flug. Als das Flugzeug zur Landung ansetzt, zieht der Deutsche seine Schuhe an und er bemerkt sofort, was passiert ist und er fragt, warum nur, wie lange wird das noch weitergehen, dieser Kampf zwischen unseren Nationen, dieser Hass, diese Animositäten, dieses in die Schuhe spucken und in die Cola pissen.\n\nVollständiger Text in der vorliegenden Transkription nicht enthalten."}, {"number": 4, "title": "One Hole Behind", "lang": "English", "body": "A man playing on a new golf course got confused as to what hole he was on. He saw a lady playing ahead of him. He walked up to her and said, do you know what hole you're playing so I can work out where I am? She goes, I'm on the seventh hole and you're a hole behind me. So, you're on the sixth. He went, cheers and went back to golf. On hole nine, the same thing happened and just he forgot and he went up to her and said, I'm really sorry, I've forgotten what hole am I on? She goes, I'm on the 14th and you're a hole behind me, so you're on the 13th. Once again, he thanked her. He finished his round off and went to the clubhouse and saw that same lady sitting at the end of the bar. He went up to her and said, can I buy you a drink to show appreciation for your help? She said, sure. And they started off a little conversation and he asked her what kind of work she was into. She said she was into sales. And he said, what kind of sales? And she was like, I just sell stuff. He was like, go on. She's like, if I tell you, you're just going to laugh. He goes, no, I won't. She goes, I sell tampons. And with that, he fell onto the floor laughing really hard. She said, see, I knew you would laugh. You're so childish. He goes, no, no, no. I'm not laughing at what you sell. It's just that I'm a toilet paper salesman. So I'm still one hole behind you\n\nTexte intégral indisponible dans la transcription fournie."}, {"number": 5, "title": "Marry Her", "lang": "English", "body": "uys in their mid-20s are sitting at a bar having a beer. One of the guys remarks to the other, boy, he looks tired. His friend replies, dude, I'm exhausted. My girlfriend wants to make love all the time, three, four, sometimes even six times a night. She wakes me up at all hours. I don't know what to do. An old gentleman in his 70s, sitting a few bar stools down, overhears their conversation. He looks over at the two men, showing the wisdom of his age, said, marry her. That'll put an end to that nonsense\n\nTexte intégral indisponible dans la transcription fournie."}, {"number": 6, "title": "Are We There Yet?", "lang": "English", "body": "Two sperm are racing towards the ovaries. One looks at the other and asks, “Are we there yet?” The other replies, “No, we’ve got a long way to go. We’ve only just passed the tonsils.”"}, {"number": 7, "title": "The Swedish Chicken", "lang": "English", "body": "A man went to a brothel with fifty quid. The madam said all the workers were busy, but she could offer him a chicken. “I’m not doing that with a chicken,” he said. She explained that it was a special Swedish chicken, skilled in pleasing men, and offered him a first-time price of twenty quid.\n\nWilling to try anything once, he paid and went into a room. As soon as he entered, the chicken was all over him.\n\nThe following week, he returned. The madam said everyone was busy and the chicken was having a night off, but she could offer him a live show. She showed him into a dark room with a dozen other men. They watched two men and a woman through a two-way mirror.\n\nAfterwards, he said to the man next to him, “Phew! That was great!”\n\n“You should have been here last week,” the man replied. “Some guy fucked the chicken!”"}, {"number": 8, "title": "The Bear, the Rabbit and the Fairy", "lang": "English", "body": "A bear is chasing a rabbit through the woods. Suddenly they see a fairy tied to a tree. They untie her, and the grateful fairy offers each of them three wishes.\n\nThe bear wishes to be the only male bear in the area. The rabbit wishes to be a millionaire.\n\nFor his second wish, the bear asks to be the only male bear in the country. The rabbit asks for a brand-new motorcycle and riding gear.\n\nFor his final wish, the bear asks to be the only male bear in the world.\n\nThe fairy turns to the rabbit. He puts on his gear, climbs onto his new motorcycle, grins, and says, “I wish the bear was gay.”"}, {"number": 9, "title": "The Dog, the Lion and the Monkey", "lang": "English", "body": "A dog strays into a jungle. A lion sees him and thinks, “This guy looks edible. Never seen this kind before.” The lion rushes toward him.\n\nThe dog notices, panics, then spots some bones nearby. He loudly says, “Mmm, that was some good lion meat!”\n\nThe lion stops abruptly. “Whoa, this guy seems tougher than he looks. Better get out of here.”\n\nA monkey in a treetop sees everything and tells the lion about the trick, hoping for a reward. The furious lion tells the monkey, “Get on my back. We’ll go get him together.”\n\nAs they rush back, the dog sees them approaching. Thinking quickly, he says loudly, “Where’s that monkey? I told him to bring me another lion an hour ago!”"}, {"number": 10, "title": "Marriage in Heaven", "lang": "English", "body": "A man and his girlfriend die in a car accident and arrive at the pearly gates. Saint Peter welcomes them and asks whether they have any questions.\n\nThe man says, “My girlfriend and I never got the chance to get married while we were alive. Could we get married in heaven?”\n\nPeter says he will find out. Six weeks later, he returns: “Yes, you can get married in heaven.”\n\nThe couple hesitate. “Eternity is a long time. If things don't work out, can we get divorced in heaven?”\n\nPeter replies, “Christ, it took me six weeks to get a priest up here. Do you have any idea how long it'll take me to find a lawyer?”"}, {"number": 11, "title": "The Typewriter", "lang": "English", "body": "A couple decide to use the code word “typewriter” for sex so their children won't understand.\n\nOne day the husband tells their five-year-old daughter, “Go tell your mummy that Daddy needs to type a letter.”\n\nThe mother replies through the child, “Tell Daddy he can't type a letter right now because there's a red ribbon in the typewriter.”\n\nA few days later, the mother tells her daughter, “Tell Daddy he can type that letter now.”\n\nThe girl returns almost immediately: “Daddy said never mind the typewriter. He already wrote the letter by hand.”"}, {"number": 12, "title": "The Man at the Door", "lang": "English", "body": "A woman answers a knock at the door. A stranger asks, “Do you have a vagina?” Disgusted, she slams the door and tells her husband that evening.\n\nThe next morning the man returns and asks the same question. She slams the door again and phones her husband. He takes the next day off and plans to hide behind the door while she answers.\n\nThe stranger appears again and asks, “Do you have a vagina?”\n\n“Yes, I do,” she says.\n\n“Good,” the man replies. “Would you mind telling your husband to leave my wife alone and start using yours instead?”"}, {"number": 13, "title": "The Elephant Trunk", "lang": "English", "body": "A man has a hot date and wants to impress her in bed. A doctor offers an experimental penis-enlargement procedure using muscle cells from an elephant's trunk. The man agrees.\n\nAt dinner with his date, he feels increasing pressure in his trousers and discreetly unzips his fly. His penis shoots out across the table, grabs a bread roll, and disappears back under the table.\n\nHis date, shocked but intrigued, asks, “Could you do that again?”\n\nWith tears in his eyes, he replies, “Probably. But I don't think I can fit another roll in my arse.”"}, {"number": 14, "title": "Lovemaking After Death", "lang": "English", "body": "A couple agree that whoever dies first will return and tell the other whether there is lovemaking after death. The wife dies first and later contacts her husband.\n\nShe describes her routine: she makes love in the morning, has breakfast, goes out into the sunshine, makes love again, eats plenty of greens for lunch, returns outside, makes love with different partners until nightfall, sleeps, and repeats it the next day.\n\nThe astonished husband says, “Wow! That's not how I imagined heaven.”\n\n“Heaven?” she replies. “What do you mean, honey? It's a zoo!”\n\nNote: The spoken transcription has a few garbled details about the daytime activities; this version preserves the setup and punchline."}, {"number": 15, "title": "Le gagnant du Loto à la banque", "lang": "Français", "body": "Un type entre dans une banque. La caissière lui demande : « Monsieur, que puis-je faire pour vous ? »\n\nIl répond : « C'est simple, connasse, je veux ouvrir un compte dans ta banque de merde ! »\n\nLa caissière s'indigne : « Mais enfin, monsieur ! Je ne vous permets pas ! »\n\n« Ferme ta gueule ! Va chercher ton connard de directeur ! »\n\nOutrée, elle va chercher le directeur  neither of them is hurt.\n\nAfter they crawl out of their cars, the rabbi sees the priest and says, \"Ah, see, Reverend, I'm a rabbi. Just look at our cars. There's nothing left, but we're unharmed. This must be a sign from God. God must have meant for us to be friends and live together in peace for the rest of our lives.\"\n\nThe priest nods. \"I agree with you completely. This must be a sign from God.\"\n\nThe rabbi continues, \"And look at this. Here's another miracle. My car is completely demolished, but this bottle of Mogen David wine didn't break. Surely God wants us to drink this wine and celebrate our good fortune.\"\n\nHe hands the bottle to the priest. The priest agrees, takes a few big swigs, and hands the bottle back to the rabbi. The rabbi immediately puts the cap back on.\n\nThe priest asks, \"Aren't you having any?\"\n\nThe rabbi replies, \"Nah, I think I'll just wait for the police.\""}, {"number": 19, "title": "The Bedtime Prayer", "lang": "English", "body": "Daddy is listening to his daughter say a prayer before bedtime. She says, \"God bless mommy, and God bless daddy, and God bless grandma, and goodbye grandpa.\"\n\nThe dad asks, \"Hang on a second, why did you say that?\"\n\nThe girl says, \"I don't know. I just feel like saying it.\"\n\nThe next day, grandpa drops dead. The dad thinks it's an odd coincidence.\n\nA month later, at bedtime, the daughter says, \"God bless mommy and daddy, and goodbye grandma.\" Sure enough, the next day, grandma dies. Dad realizes this is more than a coincidence, but he doesn't tell his wife.\n\nMonths go by. One night, he hears his daughter praying: \"God bless mommy...\" She turns her head, looks straight at him, and says, \"And goodbye daddy.\"\n\n\"Are you sure, honey?\" he asks. She nods. The man is terrified and can't sleep all night.\n\nThe next day, he goes to work, locks himself in his office, takes his phone off the hook, cancels all his meetings, and waits. He stays past five, watching the hours tick by. Finally, midnight comes, and he's still alive. He realizes he's cheated death.\n\nHe drives home, exhausted and drenched in sweat. His wife is waiting.\n\n\"Where the hell were you today?\" she asks.\n\n\"Don't shout,\" he says. \"I've had an absolutely miserable day.\"\n\n\"You've had a miserable day?\" she replies. \"I'm the one who's had a miserable day. First, the milkman dropped dead on the steps!\""}, {"number": 20, "title": "The Auction", "lang": "English", "body": "A husband and wife are sitting at the breakfast table.\n\nThe wife says, \"I had a dream last night. I was at an auction, and they were auctioning penises. Average-sized ones were going for twenty-five dollars. The big ones were going for fifty. And ten-centimetre ones were going for three hundred.\"\n\nThe husband says, \"Is that right? How much did mine go for, babes?\"\n\nThe woman says, \"Fifty cents.\"\n\nSo the guy says, \"You know what? I also had a dream last night about an auction. In my dream, they were auctioning vaginas. Okay ones were going for twenty-five dollars. Pretty tight ones were going for fifty. And the really super wet ones were going for one hundred dollars.\"\n\nThe woman says, \"Oh yeah? Well, how much was one like mine?\"\n\nAnd the guy goes, \"That's where they held the auction!\""}, {"number": 21, "title": "The Millionaire and the Priest", "lang": "English", "body": "A millionaire goes to church to make a confession.\n\nThe priest asks him, \"What's your sin, my son?\"\n\n\"Father, I'm just too greedy.\"\n\n\"Greed indeed is a grave sin. Here's what you do, my son. When you leave the church, you must give one hundred dollars to the very first person you see.\"\n\n\"What? A hundred dollars? You know that's a lot of money!\"\n\n\"My son, you have to do it if you wish to set yourself on the path to righteousness and redemption.\"\n\nThe millionaire decides to follow his advice.\n\nHe steps outside the church, and there's no one around. He walks a little further, still no one around, so he keeps on going until he reaches a dark corner with a few alleyways nearby.\n\nHe spots a young woman wearing high heels, a short skirt, and a ton of makeup.\n\nHe approaches her, hands her a hundred-dollar bill, and says, \"Here, take this.\"\n\n\"Uh, no, that's not enough. I'm going to need three hundred, sir.\"\n\n\"Three hundred? The priest told me I only had to give a hundred!\""}, {"number": 22, "title": "God and the Cheating Wife", "lang": "English", "body": "A woman cheats on her husband after years of happy marriage.\n\nRealising her mistake, she starts praying to God:\n\n\"Lord, I know what I did was wrong, but my marriage is the only thing that gives me purpose and joy. Please don't let my husband find out!\"\n\nSuddenly, she hears a voice from above:\n\n\"Okay, my child, it will be as you wish, on one condition. Years from now, you will die by drowning.\"\n\nThe woman hesitates at first.\n\n\"Oh well, Lord, if it means he'll never find out, so be it, so be it.\"\n\nThe next years of her life are happy and wonderful. She starts a successful business and lives in comfort with her husband.\n\nHowever, she continues to cheat on him many times and eventually forgets her conversation with God.\n\nOne day, she decides to go on vacation aboard a cruise ship.\n\nSuddenly, a massive storm strikes.\n\nBOOM!\n\nA huge wave rocks the ship, and it begins to sink.\n\nRemembering her agreement with God, she is struck with grief and regret and begins praying:\n\n\"Lord, you won't let all these innocent people die just because of me, right?\"\n\nShe hears a familiar voice booming from above:\n\n\"Are you kidding me? I've been working on getting all you cheaters together on this ship for years!\"\n\"Well, that's because the priest is a regular customer!\""}, {"number": 23, "title": "Why Did the Priest Invent Baptism?", "lang": "English", "body": "\"Why did the priest invent baptism?\"\n\n\"To wash their sex toys!\""}, {"number": 24, "title": "How Does a e enemy ship.\n\nAfter the victory, the soldiers asked him:\n\n\"Sir, why did you ask for your red shirt?\"\n\nThe commander smiled and said:\n\n\"I was afraid I might get wounded. I didn't want my soldiers to see my blood and lose their courage, so I wore red to hide it.\"\n\nA few days later, another soldier came running and shouted:\n\n\"Sir! There are about fifty enemy ships approaching us!\"\n\nThe commander turned pale and shouted:\n\n\"BRING ME MY BROWN TROUSERS!\""}];
